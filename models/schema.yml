version: 2
sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
         - name:date_date
           description: date 
         - name:orders_id
           description: id of orders
         - name:pdt_id 
           description: id of pdt 
         - name:revenue
           description:revenue 
         - name:quantity
           description:quantity 

       - name: product
         identifier: raw_gz_product
         description: products of Greenweez
         columns:
          - name:products_id
            description:id of products 
          - name:purchSE_PRICE
            description:purchase price 
       - name: ship
         identifier: raw_gz_ship
         description:ship of Greenweez
        columns:
          - name:orders_id
            description: id of orders 
          - name:shipping_fee
            description:fee of shipping 
          - name:shipping_fee_1
            description:fee of shipping 
          - name:logCost
            description:cost of log 
          - name:ship_cost
            description:cost of ship  